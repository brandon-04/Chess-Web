<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandons Chess Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="optionsBox">
        <div id="moveCounterBox">
            <h1 id="fullmoveCounter">Fullmoves: -</h1>
            <h1 id="halfmoveClock">Halfmove Clock: -</h1>
            <h1 id="activeColourCounter">Active Colour: -</h1>
        </div>
        <div id="buttonsBox">
            <div class="buttons" id="startNewButton"><p>start new</p></div>
            <div class="buttons" id="saveButton"><p>save game</p></div>
            <div class="buttons" id="loadButton"><p>load game</p></div>
        </div>
    </div>

    <div id="outerGrid">
        
    </div>

    <div id="moveContainer">
        <div id="titleBox">
            <h1>moves</h1>
        </div>
        <div id="mainMoveContent"></div>
    </div>
</body>
</html>
